[database]
target_db_base_path = "...\\outputs"
target_db_name = "Personal_Finance_DB.duckdb"
raw_document_store_name = "Personal_Finance_DB_Raw_Store.sqlite"
disable_file_discoverer = false

[sources]
household_database = "...\\SOURCE_DB.db"
statements_root = "...\\Statements"
column_master = "...\\column_master.csv"
mutual_fund_instrument_mapping = "...\\mutual_fund_instrument_mapping.csv"
instrument_master = "...\\instrument_master.csv"
benchmark_master = "...\\benchmark_master.csv"
currency_reference = "...\\currency_reference.csv"
financial_year_parameters = "...\\financial_year_parameters.csv"
opening_balances = "...\\opening_balances.csv"

[statement_patterns]
stock_pl = "Stock PL Statements"
mf_holdings = "Mutual Funds - Holdings"
stock_orders = "Stock - Orders"
mf_orders = "Mutual Funds - Orders"
us_stock_transactions = ["IND Money (US Stocks)", "Transaction Reports"]

[hash_policy]
household_database = "CONTENT"
statements = "NONE"
reference_data = "CONTENT"

[observability]
logs_directory = "logs/runs"
retain_last_n_runs = 12
