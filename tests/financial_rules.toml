category_ids = []
sub_category_ids = []

[income.interest]
category_ids = []
sub_category_ids = []

[expense.core]
category_ids = []
sub_category_ids = []

# Asset mappings

[assets.illiquid]
category_ids = ["ESTATE", "EPF", "PPF", "NPS"] # Example IDs, adjust as needed
