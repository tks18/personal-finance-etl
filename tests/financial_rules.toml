sub_category_ids = []

[assumptions.macro]
# Default number of trading days in a year for annualized volatility calculations.
default_trading_days = 252.0
# Fallback annualized inflation rate if historical macro data is unavailable.
fallback_inflation_rate = 0.06
# Fallback annualized risk-free rate if historical macro data is unavailable.
fallback_risk_free_rate = 0.06

[assumptions.fire]
# Safe Withdrawal Rate multiplier (e.g., 28.5 for the 3.5% rule, moderate stance).
swr_multiplier = 28.5
# Assumed real (inflation-adjusted) return for Coast FI compounding.
coast_fi_real_return = 0.05
# Number of years to coast (compound without contributions) for Coast FI targets.
coast_fi_years = 10
# Ratio of the Target FI amount considered sufficient for Lean FI (e.g., 0.7 for 70%).
lean_fi_ratio = 0.7
# Fallback nominal return to use for FIRE forecasting if historical trailing returns are unavailable.
fallback_trailing_return = 0.11
# Floor Safe Withdrawal Rate (SWR) during severe portfolio drawdowns.
cape_swr_floor = 0.04
# Ceiling Safe Withdrawal Rate (SWR) during moderate drawdowns.
cape_swr_ceiling = 0.045
# Base Safe Withdrawal Rate (SWR) during normal market conditions.
cape_swr_base = 0.035
# The maximum age until which you expect to be healthy and working.
human_capital_max_age = 55.0
# Annual discount rate applied to future earnings to assess human capital value.
human_capital_discount_rate = 0.05


[assumptions.monte_carlo]
# Number of Monte Carlo paths/simulations to run.
iterations = 10000
# Maximum months allowed to reach FI. (400 months = ~33 years to hit your FI number)
max_months = 400
# Assumed annualized standard deviation (volatility) of returns.
annual_volatility = 0.15
# Absolute minimum annualized real return applied during Monte Carlo forecasting.
real_return_floor = 0.01
# Desired target age for FIRE calculations. (Plan for longer lifespan for safety)
desired_target_age = 85
# Date of birth in YYYY-MM-DD format.
date_of_birth = "2000-05-16"

[assumptions.tax]
# Date before which debt mutual funds retain indexation benefits.
debt_mf_cutoff_date = "2023-04-01"
# Minimum days to wait before re-buying a harvested instrument to avoid wash-sale rules.
harvest_wait_days_threshold = 90
# Annual tax-free exemption limit for equity Long Term Capital Gains.
fallback_equity_ltcg_exemption = 125000.0

[assumptions.tax.ltcg_thresholds]
# Holding period thresholds in days for Long Term Capital Gains across asset classes.
equity_listed = 365
equity_unlisted = 730
debt_mf = 1095
debt_other = 1095
debt_ = 1095
gold_mf = 730
gold_ = 365
sgb_mf = 730
sgb_ = 365
silver_mf = 730
silver_ = 365

[assumptions.tax.rates]
equity_ltcg = 0.125
equity_stcg = 0.20
debt_ltcg = 0.20
debt_stcg = 0.30
gold_ltcg = 0.20
gold_stcg = 0.30

[assumptions.cma]
expected_real_return = 0.05
fat_tail_multiplier = 1.2

[assumptions.target_allocations]
"Direct Stocks" = 0.40
"ETFs" = 0.40
"Mutual Funds" = 0.20

# Budget Rules (40/20/30+10 rule)
[budget.income_allocation]
# Max % of smoothed income for core/fixed needs (rent, EMI, utilities, groceries)
core_expense_pct = 0.40
# Max % for non-core/discretionary (dining, shopping, travel)
non_core_expense_pct = 0.20
# Minimum % to deploy into investment accounts via net transfers
investment_pct = 0.30
# Implicit buffer/savings cushion = 1 - 0.40 - 0.20 - 0.30 = 0.10

[budget.alerts]
# Flag Is_Overspent if actual > budget_target by this fraction
overspend_alert_threshold = 0.05
# Emergency fund target: N months of core expenses
emergency_fund_target_months = 6

[budget.smoothing]
# Trailing months used for recency-biased income smoothing (3×T-1 + 2×T-2 + 1×T-3)
income_smoothing_months = 3
