source_id = "opening_balance_csv"
dataset_id = "household_opening_balances"
enabled = true
[datasets.selector]
provider_type = "csv"
delimiter = ","
encoding = "utf-8"
has_header = true

[[datasets]]
source_id = "benchmark_master_csv"
dataset_id = "investment_benchmark_master"
enabled = true
[datasets.selector]
provider_type = "csv"
delimiter = ","
encoding = "utf-8"
has_header = true

