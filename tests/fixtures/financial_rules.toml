# =============================================================================
# PFETL Capability-Scoped Financial Rules Configuration
# Product Principle: Users configure their evidence and policies; PFETL owns financial meaning.
#
# Headings map directly to capability namespaces:
# - [household]   : Core income classification, expense categorization, and budgeting
# - [wealth]      : Asset classification, cashflow pools, conduits, and digital assets
# - [investments] : Currency defaults, scheme mappings, instrument classes, portfolio drift
# - [benchmark]   : Market benchmark index selection and risk-free rates
# - [tax]         : Capital gains holding periods, indexation cutoffs, exemption limits, rates
# - [fire]        : Macro assumptions, FIRE multipliers, and Monte Carlo simulation parameters
# =============================================================================

