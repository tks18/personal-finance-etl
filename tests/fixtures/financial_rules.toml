# Maximum fraction of smoothed income allocated to discretionary living and lifestyle
non_core_expense_pct = 0.20
# Target fraction of smoothed income systematically deployed into investment accounts
investment_pct = 0.30

[household.budget.alerts]
# Fractional threshold above budget target before triggering an overspend alert (e.g. 0.05 = 5%)
overspend_alert_threshold = 0.05
# Emergency fund reserve target measured in multiples of monthly core expenses
emergency_fund_target_months = 6

[household.budget.smoothing]
# Trailing months window used for weighted recency income smoothing (3xT-1 + 2xT-2 + 1xT-3)
income_smoothing_months = 3


