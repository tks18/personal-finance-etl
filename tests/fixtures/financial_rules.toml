[assumptions.tax.rates]
# Listed Indian equity (Section 111A / 112A)
equity_ltcg = 0.125
equity_stcg = 0.20
# Foreign listed equity via LRS (US stocks) — post-Budget 2024
# LTCG (> 24 months): 12.5% concessional rate
# STCG (≤ 24 months): investor's income-tax slab rate
