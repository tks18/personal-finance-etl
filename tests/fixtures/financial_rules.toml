# =============================================================================
# 6. Capability: FIRE & SIMULATION
# =============================================================================

# Macroeconomic Baseline Assumptions
[fire.macro]
# Default number of trading days per calendar year for volatility annualization
default_trading_days = 252.0
# Fallback annualized inflation rate when empirical historical data is missing
fallback_inflation_rate = 0.06
# Fallback annualized risk-free return rate
fallback_risk_free_rate = 0.065
# Fallback ordinary marginal income tax rate
fallback_ordinary_income_rate = 0.9112

# Financial Independence & Retirement Rules
[fire.fire]
# Safe Withdrawal Rate multiplier (28.5 corresponds to ~3.5% withdrawal rate)
swr_multiplier = 28.5
# Real return rate for Coast FI accumulation without additional contributions
coast_fi_real_return = 0.05
# Compounding horizon (in years) for Coast FI forecasting
coast_fi_years = 10
# Fraction of standard FI target required for Lean FI (0.7 = 70%)
lean_fi_ratio = 0.7
# Fallback nominal return for FIRE projections
fallback_trailing_return = 0.11
# Shiller CAPE-adjusted SWR floor during deep valuation drawdowns
cape_swr_floor = 0.04
# Shiller CAPE-adjusted SWR ceiling during cheap market valuations
cape_swr_ceiling = 0.045
# Shiller CAPE-adjusted baseline SWR
cape_swr_base = 0.035
# Maximum working age for human capital earnings valuation
human_capital_max_age = 55.0
# Annual discount rate applied to future human capital cashflows
human_capital_discount_rate = 0.05

# Stochastic Monte Carlo Engine Configuration
[fire.monte_carlo]
# Number of stochastic iteration paths to simulate (minimum 100)
iterations = 10000
# Maximum projection horizon in months (400 months = ~33.3 years)
max_months = 400
# Assumed annualized standard deviation (volatility) of equity returns
annual_volatility = 0.15
# Guaranteed minimum real return floor
real_return_floor = 0.01
# Rolling window (in months) for Sequence of Returns Risk (SORR) CAGR evaluation
sorr_cagr_window_months = 60
# Target life expectancy age for terminal decumulation safety
desired_target_age = 85
# Date of birth (YYYY-MM-DD) for actuarial cohort calculations
date_of_birth = "1995-01-01"

# Merton Jump-Diffusion Black Swan Crash Parameters
[fire.monte_carlo.jump_diffusion]
# Annual probability of an unexpected market crash (5% per year)
jump_probability_annual = 0.05
# Magnitude of downward asset shock when a jump occurs (-20%)
jump_magnitude = -0.20
# Annual fee drag from ETF expense ratios and portfolio management costs (0.3%)
expense_ratio_drag = 0.003

# 3-State Markov Regime Transition Matrix (0: Bull, 1: Bear, 2: Stagflation)
[fire.monte_carlo.markov_regime]
# Transition probabilities matrix; each row must sum strictly to 1.0
transition_matrix = [
    [0.85, 0.12, 0.03], # From Bull -> [Bull: 85%, Bear: 12%, Stagflation: 3%]
    [0.45, 0.50, 0.05], # From Bear -> [Bull: 45%, Bear: 50%, Stagflation: 5%]
    [0.30, 0.10, 0.60]  # From Stagflation -> [Bull: 30%, Bear: 10%, Stagflation: 60%]
]
# Regime parameters: [annual_drift, annual_volatility, inflation_target]
state_bull = [0.18, 0.18, 0.05]  # Expansion: high growth, moderate volatility, stable inflation
state_bear = [-0.20, 0.25, 0.04] # Contraction: negative growth, high volatility, disinflation
state_stag = [-0.02, 0.20, 0.08] # Stagflation: low growth, elevated volatility, high inflation

# Human Capital Income Shock Parameters
[fire.monte_carlo.human_capital]
# Probability of suffering an income shock (job loss, bonus cut) during Bear or Stagflation
shock_probability = 0.20
# Minimum duration of income shock in months
shock_duration_min = 6
# Maximum duration of income shock in months
shock_duration_max = 12
# Fraction of core expenses covered by severance/benefits during shock
unemployment_benefit_coverage_pct = 0.0

# Asset Allocation Glide Path & Bond Tent Rules
[fire.monte_carlo.glide_path]
# Months prior to target retirement date to begin de-risking equity exposure
derisk_start_months_prior = 60
# Months after target retirement date to gradually re-risk equities back to base
post_fi_re_risk_months = 120
# Maximum equity allocation during full accumulation and mature retirement
base_equity_weight = 0.70
# Minimum equity allocation (maximum conservative bond buffer) at retirement date
fi_target_equity_weight = 0.55
# Expected real return for debt/bond tent allocation
debt_real_return = 0.02
# Expected volatility for debt/bond tent allocation
debt_volatility = 0.04
# If true, withdrawals during down-markets draw from debt buffer first, preventing equity liquidation
dynamic_debt_drawdown_first = true

# Guyton-Klinger Dynamic Spending Guardrails
[fire.monte_carlo.guyton_klinger]
# Multiplier over initial SWR to trigger lifestyle cut guardrail (+20% threshold breach)
withdrawal_upper_threshold = 1.2
# Multiplier under initial SWR to trigger lifestyle raise guardrail (-20% threshold breach)
withdrawal_lower_threshold = 0.8
# Spending reduction factor when cutting lifestyle (-10% reduction)
lifestyle_cut_multiplier = 0.90
# Spending increase factor when raising lifestyle (+10% increase)
lifestyle_raise_multiplier = 1.10

# Ornstein-Uhlenbeck Stochastic Inflation Process
[fire.monte_carlo.inflation_model]
# Mean-reversion speed parameter (theta)
mean_reversion_speed = 0.1
# Annualized inflation volatility
volatility_annual = 0.015
# Absolute maximum cap on simulated inflation to prevent hyperinflation distortions
max_inflation_cap = 0.15
# Absolute minimum floor on deflation
min_deflation_floor = -0.02

# Capital Market Assumptions (CMA) for Long-Term Forecasting
[fire.cma]
expected_real_return = 0.05
fat_tail_multiplier = 1.2

# Target Asset Allocations for Strategic Rebalancing
[fire.target_allocations]
"Direct Stocks" = 0.25
"ETFs" = 0.15
"Mutual Funds" = 0.60
