# ==============================================================================
# Mypy Type Checker Configuration
# Repository: personal-finance-etl
# Python: >=3.13 | Strict Mode
# Linked Companion Configs:
#   - Ruff: ruff.toml
#   - Pylint: .pylintrc
#   - Flake8: .flake8
#   - Codacy: .codacy.yml
#   - CodeRabbit: .coderabbit.yaml
# ==============================================================================

[mypy]
files = src
mypy_path = src
python_version = 3.13
warn_return_any = True
warn_unused_configs = True
disallow_untyped_defs = True
no_implicit_optional = True
strict_optional = True
pretty = True
strict = True

# Exclude every directory and root file except src/
exclude = (?x)(
    ^tests
    | ^scripts
    | ^build
    | ^dist
    | ^docs
    | ^outputs
    | ^backups
    | ^scratch
    | ^node_modules
    | ^\.planning
    | ^\.venv
    | ^main\.py$
  )

