---
# ==============================================================================
# Codacy Static Code Analysis & Code Quality Configuration
# Repository: personal-finance-etl
# Python: >=3.13 | Architecture: Clean Architecture & Modular Pipelines
# Linked Native Configurations:
#   - Ruff Linter & Formatter: ruff.toml (automatically detected by Codacy)
#   - Pylint Static Analysis: .pylintrc (automatically detected by Codacy)
#   - Prospector Meta-Linter: .prospector.yml
#   - Mypy Strict Type Checking: mypy.ini
#   - Pyright Strict Type Checking: pyrightconfig.json
#   - Flake8 / CodeFactor: .flake8
#   - CodeRabbit AI Review: .coderabbit.yaml
# ==============================================================================

# Global exclusions: exclude every folder and non-source root file except src/
exclude_paths:
  - 'tests/**'
  - 'scripts/**'
  - 'docs/**'
  - '.planning/**'
  - 'build/**'
  - 'dist/**'
  - 'outputs/**'
  - 'backups/**'
  - 'scratch/**'
  - 'node_modules/**'
  - '.yarn/**'
  - '.github/**'
  - 'main.py'
  - 'main.spec'
  - '.versionrc.js'
  - 'package.json'
  - 'yarn.lock'
  - 'uv.lock'
  - 'CHANGELOG.md'
  - 'src/personal_finance_etl/presentation/docs/assets/**'
  - '**.min.js'
  # Exclude Declarative DDL Schemas (raw multi-line SQL table definitions)
  - 'src/personal_finance_etl/infrastructure/warehouse/schema/**'
  - 'src/personal_finance_etl/infrastructure/control_plane/schema.py'
  # Exclude Monte Carlo Simulation numerical Numba @njit kernels
  - 'src/personal_finance_etl/domain/fire/simulation.py'

engines:
  # Python Linter & Modernizer (aligned with line-length: 100 in ruff.toml)
  ruff:
    enabled: true
    exclude_paths:
      - 'tests/**'
      - 'scripts/**'
      - 'src/personal_finance_etl/presentation/docs/assets/**'
      - '.planning/**'
      - 'docs/**'
      - 'src/personal_finance_etl/infrastructure/warehouse/schema/**'
      - 'src/personal_finance_etl/infrastructure/control_plane/schema.py'
      - 'src/personal_finance_etl/domain/fire/simulation.py'

  # Python Security Analysis (SAST)
  bandit:
    enabled: true
    exclude_paths:
      - 'tests/**' # Exclude pytest assert statements (B101) and test mocks
      - 'scripts/**'
      - '.planning/**'
      - 'docs/**'

  # Static Code Analyzer & Code Smell Detector (delegates to .pylintrc)
  pylint:
    enabled: true
    exclude_paths:
      - 'tests/**'
      - 'scripts/**'
      - 'src/personal_finance_etl/presentation/docs/assets/**'
      - '.planning/**'
      - 'docs/**'
      - 'src/personal_finance_etl/infrastructure/warehouse/schema/**'
      - 'src/personal_finance_etl/infrastructure/control_plane/schema.py'
      - 'src/personal_finance_etl/domain/fire/simulation.py'

  pylintpython3:
    enabled: true
    exclude_paths:
      - 'tests/**'
      - 'scripts/**'
      - 'src/personal_finance_etl/presentation/docs/assets/**'
      - '.planning/**'
      - 'docs/**'
      - 'src/personal_finance_etl/infrastructure/warehouse/schema/**'
      - 'src/personal_finance_etl/infrastructure/control_plane/schema.py'
      - 'src/personal_finance_etl/domain/fire/simulation.py'

  # Multi-Linter Engine (delegates to .prospector.yml)
  prospector:
    enabled: true
    exclude_paths:
      - 'tests/**'
      - 'scripts/**'
      - 'src/personal_finance_etl/presentation/docs/assets/**'
      - '.planning/**'
      - 'docs/**'
      - 'src/personal_finance_etl/infrastructure/warehouse/schema/**'
      - 'src/personal_finance_etl/infrastructure/control_plane/schema.py'
      - 'src/personal_finance_etl/domain/fire/simulation.py'

  # Code Duplication & Clone Detection (PMD-CPD)
  duplication:
    enabled: true
    exclude_paths:
      - 'tests/**' # Exclude test fixtures, assertions, and mock data repetition
      - 'scripts/**' # Exclude commit registries and orchestration utilities
      - '.planning/**' # Exclude historical analysis CSVs and phase trackers
      - 'src/personal_finance_etl/presentation/docs/assets/**' # Exclude vendored minified JS
      - 'src/personal_finance_etl/infrastructure/warehouse/schema/**'
      - 'src/personal_finance_etl/infrastructure/control_plane/schema.py'
      - 'src/personal_finance_etl/domain/fire/simulation.py'
      - '**.min.js'
      - 'docs/**'

  # Code Metrics Engine (Cyclomatic Complexity, NLOC, Nesting via Lizard)
  metric:
    enabled: true
    exclude_paths:
      - 'tests/**' # Prevent test matrices from skewing production complexity scores
      - 'scripts/**'
      - '.planning/**'
      - 'src/personal_finance_etl/presentation/docs/assets/**'
      - 'src/personal_finance_etl/infrastructure/warehouse/schema/**'
      - 'src/personal_finance_etl/infrastructure/control_plane/schema.py'
      - 'src/personal_finance_etl/domain/fire/simulation.py'
      - '**.min.js'
      - 'docs/**'

  lizard:
    enabled: true
    exclude_paths:
      - 'tests/**'
      - 'scripts/**'
      - '.planning/**'
      - 'src/personal_finance_etl/presentation/docs/assets/**'
      - 'src/personal_finance_etl/infrastructure/warehouse/schema/**'
      - 'src/personal_finance_etl/infrastructure/control_plane/schema.py'
      - 'src/personal_finance_etl/domain/fire/simulation.py'
      - '**.min.js'
      - 'docs/**'

  # Markdown Linting
  markdownlint:
    enabled: true
    exclude_paths:
      - '.planning/**' # Exclude planning registers and large CSV audit files
      - 'CHANGELOG.md' # Exclude standard-version generated changelog
      - 'docs/**'

languages:
  python:
    exclude_paths:
      - 'outputs/**' # Local DuckDB/SQLite lakehouse data outputs
      - 'build/**' # PyInstaller / Wheel build artifacts
      - 'dist/**' # Release bundles
      - '.venv/**' # Virtual environment
      - '_df_cache/**' # Runtime DataFrame cache
      - '.planning/**' # Planning and refactor documentation
      - 'docs/**'
      - 'src/personal_finance_etl/infrastructure/warehouse/schema/**'
      - 'src/personal_finance_etl/infrastructure/control_plane/schema.py'
      - 'src/personal_finance_etl/domain/fire/simulation.py'
  javascript:
    exclude_paths:
      - 'src/personal_finance_etl/presentation/docs/assets/**' # Vendored mermaid/svg-pan-zoom
      - '**.min.js'
      - 'docs/**'
  markdown:
    exclude_paths:
      - '.planning/**'
      - 'CHANGELOG.md'
      - 'docs/**'
