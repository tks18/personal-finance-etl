# Poe the Poet Task Runner Configuration
# Repository: personal-finance-etl
# Standalone Task Definitions & Orchestration
# Documentation: https://poethepoet.natn.io/index.html

[tasks]

dev = { cmd = "tkreload main.py", help = "Run desktop application in hot-reload development mode" }
build = { cmd = "pyinstaller --clean -y main.spec", help = "Build standalone production binary using PyInstaller" }

# GitHub Release Management
"release:preview" = { cmd = "pforge release preview", help = "Preview release notes for latest version in CHANGELOG.md" }
"release:preview:all" = { cmd = "pforge release preview --all", help = "Preview full release notes for all versions in CHANGELOG.md" }
"release:dry-run" = { cmd = "pforge release --dry-run", help = "Display dry-run summary of matching Git tags and changelog entries" }
"release:latest" = { cmd = "pforge release --run", help = "Publish the latest version from CHANGELOG.md to GitHub" }
"release:latest:draft" = { cmd = "pforge release --run --draft", help = "Publish latest version as a GitHub draft release" }
"release:all" = { cmd = "pforge release --run --interactive", help = "Publish all unreleased tags interactively to GitHub" }
"release:all:draft" = { cmd = "pforge release --run --draft", help = "Publish all unreleased tags as GitHub drafts" }
"release:pipeline" = { cmd = "pforge release pipeline --push --create-pr --draft-release", help = "Execute full post-release pipeline: git push (triggers audit) -> create PR -> draft release -> PyPI publish" }
"pypi:publish" = { cmd = "pforge publish", help = "Build and publish package to PyPI using token from .env" }

# GitHub Pull Request Management
"pr:preview" = { cmd = "pforge pr preview", help = "Preview PR title, changelog, and attached Quality Gate certification table" }
"pr:create" = { cmd = "pforge pr create", help = "Create or update PR from dev into master with Quality Gate certification" }

# Quality Gate & Diagnostics Tasks
audit = { cmd = "pforge quality", help = "Run Full Quality Gate (Ruff, Mypy, Pyright, Pylint, Pytest)" }
audit-fast = { cmd = "pforge quality --fast", help = "Run Fast Quality Gate (< 2s: Ruff Lint, Ruff Format, Mypy)" }
"audit-fast:fix" = { cmd = "pforge quality --fast --fix", help = "Run Fast Quality Gate with automatic Ruff lint and format fixing" }
audit-full = { cmd = "pforge quality", help = "Run Full Quality Gate (all configured engines: Ruff, Mypy, Pyright, Pytest)" }
audit-csv = { cmd = "pforge quality --export-csv", help = "Run Full Quality Gate and export structured CSV report" }
audit-json = { cmd = "pforge quality --export-json", help = "Run Full Quality Gate and export structured JSON report" }
audit-docs = { cmd = "pforge docs audit", help = "Run AST-level documentation compliance auditor" }

# Git Hooks Orchestration
install-hooks = { cmd = "pforge hooks install", help = "Install Git pre-commit and pre-push quality hooks" }

# Automated Conventional Commits
commit = { cmd = "pforge commit", help = "Run automated Conventional Commit tool (supports flags: -i/--interactive, --run, --dry-run, --map, --file)" }
"commit:preview" = { cmd = "pforge commit --preview", help = "Preview automated Conventional Commits without staging or committing (dry-run)" }
"commit:run" = { cmd = "pforge commit --run", help = "Execute automated Conventional Commits file-by-file immediately without prompting" }
"commit:interactive" = { cmd = "pforge commit --interactive", help = "Interactive file-by-file Commitlint wizard with diff inspection and prompt choices" }
"commit:i" = { cmd = "pforge commit --interactive", help = "Interactive file-by-file Commitlint wizard (alias for commit:interactive)" }
"commit:overrides" = { cmd = "pforge commit --map .commit_overrides.json --run", help = "Execute automated commits directly using .commit_overrides.json" }
"commit:overrides:preview" = { cmd = "pforge commit --map .commit_overrides.json --preview", help = "Preview automated commits using .commit_overrides.json without staging (dry-run)" }
"commit:overrides:only" = { cmd = "pforge commit --map .commit_overrides.json --only-mapped --run", help = "Execute commits ONLY for files explicitly defined in .commit_overrides.json" }
