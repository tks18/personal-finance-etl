name: Bug report
description: Report a reproducible software, pipeline, or financial-output defect.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a problem.

        **Do not upload real financial data.** Use synthetic or thoroughly sanitized examples. For security vulnerabilities, follow `SECURITY.md` instead of this form.
  - type: input
    id: version
    attributes:
      label: Personal Finance ETL version
      placeholder: "6.2.3 or commit abc1234"
    validations:
      required: true
  - type: input
    id: python
    attributes:
      label: Python version
      placeholder: "3.13.x"
    validations:
      required: true
  - type: input
    id: os
    attributes:
      label: Operating system
      placeholder: "Windows 11"
    validations:
      required: true
  - type: dropdown
    id: surface
    attributes:
      label: Execution surface
      options: ["CLI", "Desktop GUI", "Headless / backend", "Power BI / analytical consumption", "Build / packaging", "Documentation", "Other"]
    validations:
      required: true
  - type: dropdown
    id: stage
    attributes:
      label: Affected area
      options: ["Source discovery / Control Plane", "Extraction / Bronze", "Canonical transformation / Silver", "Investment analytics / FIFO / tax", "Wealth / cash flow", "FIRE / planning", "Gold publication / Meta", "CLI / GUI", "Power BI contract", "Build / release", "Documentation", "Unknown"]
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: What happened?
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Minimal reproduction
      description: Use synthetic or sanitized inputs only.
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: Sanitized error / log excerpt
      render: text
  - type: dropdown
    id: financial_output
    attributes:
      label: Did this affect financial outputs?
      options: ["No", "Yes", "Unsure"]
    validations:
      required: true
  - type: textarea
    id: financial_detail
    attributes:
      label: Financial-output impact
      description: If yes or unsure, describe affected positions, tax lots, XIRR, net worth, cash reconciliation, FIRE, or contracts.
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy confirmation
      options:
        - label: I have not included real or sensitive personal financial data in this report.
          required: true
        - label: I have checked existing issues and current documentation for this problem.
          required: true
