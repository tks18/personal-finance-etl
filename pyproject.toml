[project]
name = "personal-finance-etl"
version = "9.3.0"
description = "Local-first financial data engineering and quantitative decision-support platform for reconciled personal finance, investment analytics, tax evidence, FIRE simulation, and BI."
authors = [
  { name="Shan", email="tksudharshan@gmail.com" },
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"

requires-python = ">=3.13"

keywords = [
    "personal-finance",
    "financial-data-engineering",
    "data-engineering",
    "analytics-engineering",
    "etl",
    "financial-analytics",
    "quantitative-finance",
    "investment-analytics",
    "portfolio-analytics",
    "fifo",
    "reconciliation",
    "tax-analytics",
    "fire",
    "monte-carlo",
    "duckdb",
    "sqlite",
    "polars",
    "power-bi",
    "local-first",
    "data-lineage",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "customtkinter>=6.0.0",
    "duckdb>=1.5.5",
    "fastexcel>=0.20.2",
    "markdown>=3.7",
    "numba>=0.66.0",
    "pillow>=12.3.0",
    "polars>=1.42.1",
    "psutil>=7.2.2",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "python-dateutil>=2.9.0.post0",
    "pyxirr>=0.10.8",
    "pywebview>=5.3.2",
    "rich>=15.0.0",
    "tkcalendar>=1.6.1",
    "types-psutil>=7.2.2.20260518",
    "types-python-dateutil>=2.9.0.20260716",
    "yfinance>=1.5.1",
    "uuid>=1.30",
    "filelock>=4.0.3",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "poethepoet>=0.48.0",
    "pyinstaller>=6.21.0",
    "pylint>=4.1.3",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "tkreload>=1.0.4",
    "vulture>=2.16",
]
docs = [
    "mkdocs>=1.6.0",
    "mkdocs-material>=9.5.0",
    "mkdocs-minify-plugin>=0.8.0",
    "pymdown-extensions>=10.14",
]

[tool.uv]
default-groups = ["dev", "docs"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project.scripts]
shan-fin = "personal_finance_etl.presentation.launcher:main"
shan-fin-gui = "personal_finance_etl.presentation.desktop.app:main"

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "personal_finance_etl/README.md"
"docs" = "personal_finance_etl/docs"
"logo.png" = "personal_finance_etl/logo.png"
"logo.ico" = "personal_finance_etl/logo.ico"

[tool.hatch.build.targets.sdist]
exclude = [
    ".github",
    "social_preview.png",
]


[project.urls]
Homepage = "https://github.com/tks18/personal-finance-etl"
Documentation = "https://tks18.github.io/personal-finance-etl/"
Repository = "https://github.com/tks18/personal-finance-etl"
Issues = "https://github.com/tks18/personal-finance-etl/issues"
Changelog = "https://github.com/tks18/personal-finance-etl/blob/master/CHANGELOG.md"
Wiki = "https://github.com/tks18/personal-finance-etl/wiki"

[tool.bandit]
exclude_dirs = [
    "tests",
    "scripts",
    "docs",
    ".planning",
    "build",
    "dist",
    "outputs",
    "backups",
    "scratch",
    "node_modules",
    ".yarn",
    ".venv",
    "_df_cache",
]
skips = ["B101", "B110", "B404", "B603", "B607", "B608"]
