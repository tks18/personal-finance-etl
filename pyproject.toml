[project]
name = "personal-finance-etl"
version = "4.0.0"
description = "An institutional-grade, hyper-optimized Quantitative Master Engine built to absolutely dominate personal net worth"
authors = [
  { name="Shan", email="tksudharshan@gmail.com" },
]
license = "GPL-3.0-only"
license-files = ["LICENSE"]
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "adbc-driver-sqlite>=1.12.0",
    "customtkinter>=6.0.0",
    "duckdb>=1.5.5",
    "fastexcel>=0.20.2",
    "numba>=0.66.0",
    "pillow>=12.3.0",
    "polars>=1.42.1",
    "psutil>=7.2.2",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "python-dateutil>=2.9.0.post0",
    "pyxirr>=0.10.8",
    "tkcalendar>=1.6.1",
    "types-psutil>=7.2.2.20260518",
    "types-python-dateutil>=2.9.0.20260716",
    "yfinance>=1.5.1",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "poethepoet>=0.48.0",
    "pyinstaller>=6.21.0",
    "pyright>=1.1.411",
    "ruff>=0.15.22",
    "tkreload>=1.0.4",
    "vulture>=2.16",
]

[tool.poe.tasks]
dev = "uv run python -c 'from scripts.tasks import dev; dev()'"
build = "uv run python -c 'from scripts.tasks import build; build()'"

[tool.uv]
package = true

[tool.uv.sources]
tasks = { path = "./scripts/tasks.py" }

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
pretty = true


[project.urls]
Homepage = "https://github.com/tks18/personal-finance-etl"
Documentation = "https://github.com/tks18/personal-finance-etl#readme"
Repository = "https://github.com/tks18/personal-finance-etl"
Issues = "https://github.com/tks18/personal-finance-etl/issues"
Changelog = "https://github.com/tks18/personal-finance-etl/releases"

[tool.pyrefly]
search-path = ["."]
