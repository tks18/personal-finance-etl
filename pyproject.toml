[project]
name = "personal-finance-etl"
version = "11.3.2"
description = "Local-first personal financial systems platform for investment accounting, reconciliation, tax evidence, wealth analytics, FIRE planning, and BI."
authors = [
  { name="Shan", email="tksudharshan@gmail.com" },
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"

requires-python = ">=3.13"

keywords = [
    "personal-finance",
    "financial-data-engineering",
    "data-engineering",
    "analytics-engineering",
    "etl",
    "financial-analytics",
    "quantitative-finance",
    "investment-analytics",
    "portfolio-analytics",
    "fifo",
    "reconciliation",
    "tax-analytics",
    "fire",
    "monte-carlo",
    "duckdb",
    "sqlite",
    "polars",
    "power-bi",
    "local-first",
    "data-lineage",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "customtkinter>=6.0.0",
    "duckdb>=1.5.5",
    "fastexcel>=0.20.2",
    "numba>=0.66.0",
    "pillow>=12.3.0",
    "polars>=1.42.1",
    "psutil>=7.2.2",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "python-dateutil>=2.9.0.post0",
    "pyxirr>=0.10.8",
    "rich>=15.0.0",
    "tkcalendar>=1.6.1",
    "types-psutil>=7.2.2.20260518",
    "types-python-dateutil>=2.9.0.20260716",
    "yfinance>=1.5.1",
    "uuid>=1.30",
    "filelock>=4.0.3",
    "openpyxl>=3.1.5",
]

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "poethepoet>=0.48.0",
    "pyinstaller>=6.21.0",
    "pylint>=4.1.3",
    "pyright>=1.1.411",
    "pytest>=9.1.1",
    "ruff>=0.15.22",
    "tkreload>=1.0.4",
    "vulture>=2.16",
]

[tool.uv]
default-groups = ["dev"]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project.scripts]
pfetl = "personal_finance_etl.presentation.launcher:main"

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "personal_finance_etl/README.md"

[tool.hatch.build.targets.sdist]
exclude = [
    ".github",
    "social_preview.png",
]


[project.urls]
Homepage = "https://github.com/tks18/personal-finance-etl"
Documentation = "https://github.com/tks18/personal-finance-etl/blob/master/docs/README.md"
Repository = "https://github.com/tks18/personal-finance-etl"
Issues = "https://github.com/tks18/personal-finance-etl/issues"
Changelog = "https://github.com/tks18/personal-finance-etl/blob/master/CHANGELOG.md"

[tool.bandit]
exclude_dirs = [
    "tests",
    "scripts",
    "docs",
    ".planning",
    "build",
    "dist",
    "outputs",
    "backups",
    "scratch",
    "node_modules",
    ".yarn",
    ".venv",
    "_df_cache",
]
skips = ["B101", "B110", "B404", "B603", "B607", "B608"]
