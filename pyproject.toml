[project]
name = "personal-finance-etl"
version = "6.5.2"
description = "Local-first financial data platform for evidence-aware ETL, investment analytics, tax-aware wealth modelling, FIRE simulation, and BI."
authors = [
  { name="Shan", email="tksudharshan@gmail.com" },
]
license = "GPL-3.0-or-later"
license-files = ["LICENSE"]
readme = "README.md"

requires-python = ">=3.13"

keywords = [
    "personal-finance",
    "data-engineering",
    "etl",
    "analytics-engineering",
    "financial-analytics",
    "investment-analysis",
    "portfolio-analysis",
    "duckdb",
    "polars",
    "sqlite",
    "power-bi",
    "fire",
    "monte-carlo",
]

classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: End Users/Desktop",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
]

dependencies = [
    "customtkinter>=6.0.0",
    "duckdb>=1.5.5",
    "fastexcel>=0.20.2",
    "markdown>=3.7",
    "numba>=0.66.0",
    "pillow>=12.3.0",
    "polars>=1.42.1",
    "psutil>=7.2.2",
    "pyarrow>=25.0.0",
    "pydantic>=2.13.4",
    "python-dateutil>=2.9.0.post0",
    "pyxirr>=0.10.8",
    "pywebview>=5.3.2",
    "rich>=15.0.0",
    "tkcalendar>=1.6.1",
    "types-psutil>=7.2.2.20260518",
    "types-python-dateutil>=2.9.0.20260716",
    "yfinance>=1.5.1",
    "uuid>=1.30",
    "filelock>=4.0.3",
]

[build-system]
requires = ["hatchling>=1.27.0"]
build-backend = "hatchling.build"

[project.scripts]
shan-fin = "personal_finance_etl.frontend.launcher:main"
shan-fin-gui = "personal_finance_etl.frontend.desktop.app:main"

[dependency-groups]
dev = [
    "mypy>=2.3.0",
    "poethepoet>=0.48.0",
    "pyinstaller>=6.21.0",
    "pyright>=1.1.411",
    "ruff>=0.15.22",
    "tkreload>=1.0.4",
    "vulture>=2.16",
]

[tool.poe.tasks]
dev = "uv run python -c 'from scripts.tasks import dev; dev()'"
build = "uv run python -c 'from scripts.tasks import build; build()'"

[tool.uv]
package = true

[tool.uv.sources]
tasks = { path = "./scripts/tasks.py" }

[tool.hatch.build.targets.wheel.force-include]
"README.md" = "personal_finance_etl/README.md"
"docs" = "personal_finance_etl/docs"
"logo.png" = "personal_finance_etl/logo.png"

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.mypy]
python_version = "3.13"
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
no_implicit_optional = true
strict_optional = true
pretty = true
strict = true

[tool.pyright]
typeCheckingMode = "strict"
ignore = ["src/personal_finance_etl/frontend/desktop"]

[project.urls]
Homepage = "https://github.com/tks18/personal-finance-etl"
Documentation = "https://github.com/tks18/personal-finance-etl/blob/master/docs/README.md"
Repository = "https://github.com/tks18/personal-finance-etl"
Issues = "https://github.com/tks18/personal-finance-etl/issues"
Changelog = "https://github.com/tks18/personal-finance-etl/blob/master/CHANGELOG.md"
Wiki = "https://github.com/tks18/personal-finance-etl/wiki"

[tool.pyrefly]
search-path = ["."]
